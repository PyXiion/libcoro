name: ci-windows

on: [pull_request, workflow_dispatch]

jobs:
    ci-windows-2022:
        name: windows-2022
        runs-on: windows-latest
        strategy:
            matrix:
                cxx_standard: [20, 23]
                libcoro_build_shared_libs: [OFF, ON]
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    submodules: recursive
                    fetch-depth: 0
                    fetch-tags: true
            -   name: Mark repository as safe
                run: git config --global --add safe.directory "*"
            -   name: Set up MSVC
                uses: ilammy/msvc-dev-cmd@v1
            -   name: Install ccache and OpenSSL
                shell: pwsh
                run: |
                    choco install ccache --yes --no-progress
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                    "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\openssl" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            -   name: Build
                shell: pwsh
                run: |
                    cmake -S . -B Release -G Ninja `
                        -DCMAKE_BUILD_TYPE=Release `
                        -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }} `
                        -DCMAKE_C_COMPILER_LAUNCHER=ccache `
                        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
                        "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${{ github.workspace }}/Release/bin" `
                        "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
                        -DVCPKG_TARGET_TRIPLET=x64-windows `
                        -DLIBCORO_BUILD_SHARED_LIBS=${{ matrix.libcoro_build_shared_libs }} `
                        -DLIBCORO_FEATURE_NETWORKING=ON `
                        -DLIBCORO_FEATURE_TLS=ON `
                        -DLIBCORO_BUILD_TESTS=ON `
                        -DLIBCORO_BUILD_EXAMPLES=ON
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    cmake --build Release --config Release
            -   name: Test
                shell: pwsh
                working-directory: Release/bin
                run: |
                    # Skip benchmarks only, not networking/TLS/DNS.
                    .\libcoro_test.exe "~[benchmark]~[bench]"
